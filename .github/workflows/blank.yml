name: GitHub Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Roda automaticamente todo dia à meia-noite
  workflow_dispatch: # Permite que você rode manualmente para testar

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Activity Graph
        uses: ashutosh00710/github-readme-activity-graph@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH: activity-graph-output # Isso vai criar a branch que seu README procura
          CONFIG: '{"area": true, "legend": true, "color": "radical"}'
